name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Type-check, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  staging:
    name: Deploy this pull request to staging
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Keep the previous build's files, so a page open during the deploy still finds its own
        run: node scripts/keep-previous-assets.mjs https://came-in-staging.walkertbrown.workers.dev
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy
        run: npx wrangler deploy --env staging --message "pull request ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
      - name: Comment the staging link
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `Staging for this pull request: https://came-in-staging.walkertbrown.workers.dev\n\nCommit \`${sha}\` is live there now.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.startsWith("Staging for this pull request"));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  production:
    name: Deploy main to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Keep the previous build's files, so a page open during the deploy still finds its own
        run: node scripts/keep-previous-assets.mjs https://came-in.walkertbrown.workers.dev
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: npx wrangler deploy --message "main ${{ github.sha }}"
